<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公民 語句補充 単語帳</title>
<meta name="description" content="公民 第3章（民主政治・選挙・国会・内閣・裁判・三権分立）の語句補充を練習する単語帳">
<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --surface-2: #efede7;
    --text: #1d1d1f;
    --muted: #6b6a66;
    --border: #dcd9d1;
    --accent: #2563a8;
    --accent-weak: #e3ecf7;
    --red: #d1242f;
    --ok: #1f8a4c;
    --ok-weak: #e1f3e8;
    --ng: #c2410c;
    --ng-weak: #fbe9df;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151618;
      --surface: #1f2023;
      --surface-2: #2a2b2f;
      --text: #ececee;
      --muted: #9d9ca3;
      --border: #3a3b40;
      --accent: #6ea8ee;
      --accent-weak: #22324a;
      --red: #ff6b6b;
      --ok: #4ccf86;
      --ok-weak: #1c3527;
      --ng: #ff9a5c;
      --ng-weak: #3d2517;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    line-height: 1.7;
  }
  button, input { font: inherit; color: inherit; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 64px; }
  header h1 { font-size: 1.35rem; margin: 8px 0 2px; letter-spacing: .02em; }
  header p { margin: 0 0 14px; color: var(--muted); font-size: .9rem; }

  .tabs { display: flex; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 12px; margin-bottom: 12px; }
  .tabs button {
    flex: 1; border: 0; background: transparent; padding: 9px 4px; border-radius: 9px; cursor: pointer;
    font-weight: 600; color: var(--muted); white-space: nowrap;
  }
  .tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

  details.settings { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 14px; }
  details.settings summary { cursor: pointer; padding: 12px 14px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
  details.settings summary::-webkit-details-marker { display: none; }
  details.settings summary .count { color: var(--muted); font-weight: 400; font-size: .9rem; }
  .settings-body { padding: 0 14px 14px; }
  .group-label { font-size: .8rem; color: var(--muted); margin: 10px 0 6px; display: flex; justify-content: space-between; align-items: center; }
  .group-label button { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: .8rem; padding: 2px 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 5px 11px;
    cursor: pointer; font-size: .85rem; user-select: none;
  }
  .chip[aria-pressed="true"] { background: var(--accent-weak); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .chip small { opacity: .75; margin-left: 4px; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); }
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .82rem; color: var(--muted); margin-bottom: 10px; }
  .tag { background: var(--surface-2); border-radius: 6px; padding: 1px 8px; }
  .tag.key { background: var(--accent-weak); color: var(--accent); }
  .progress { height: 4px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin-bottom: 14px; }
  .progress > div { height: 100%; background: var(--accent); transition: width .2s; }

  .question { font-size: 1.12rem; min-height: 5.5em; }
  .blank {
    display: inline-block; min-width: 4.5em; text-align: center; padding: 0 .4em; margin: 0 .15em;
    border-bottom: 2px solid var(--text); font-weight: 700;
  }
  .blank.shown { color: var(--red); border-bottom-color: var(--red); }
  .reading { color: var(--muted); font-size: .9rem; margin-top: 8px; min-height: 1.6em; }
  .note { font-size: .8rem; color: var(--muted); margin-top: 4px; }

  .flip-area { cursor: pointer; border-radius: 12px; padding: 6px; margin: -6px; }
  .flip-hint { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 14px; }

  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn {
    flex: 1; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 12px 10px;
    cursor: pointer; font-weight: 600; text-align: center;
  }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.ok { background: var(--ok-weak); border-color: var(--ok); color: var(--ok); }
  .btn.ng { background: var(--ng-weak); border-color: var(--ng); color: var(--ng); }
  .btn.small { flex: 0 0 auto; padding: 8px 12px; font-size: .85rem; }
  kbd { font-family: inherit; font-size: .72rem; opacity: .6; margin-left: 4px; }

  .answer-input { display: flex; gap: 8px; margin-top: 14px; }
  .answer-input input {
    flex: 1; min-width: 0; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); font-size: 1.05rem;
  }
  .answer-input input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .verdict { margin-top: 12px; padding: 10px 12px; border-radius: 12px; font-weight: 600; }
  .verdict.ok { background: var(--ok-weak); color: var(--ok); }
  .verdict.ng { background: var(--ng-weak); color: var(--ng); }
  .verdict .correct { color: var(--text); font-weight: 400; display: block; margin-top: 2px; }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .choice {
    border: 1.5px solid var(--border); background: var(--surface); border-radius: 12px; padding: 14px 10px;
    cursor: pointer; font-weight: 700; font-size: 1.02rem; text-align: center; line-height: 1.4;
  }
  .choice kbd { display: block; margin: 4px 0 0; }
  .choice:disabled { cursor: default; }
  .choice.right { background: var(--ok-weak); border-color: var(--ok); color: var(--ok); }
  .choice.wrong { background: var(--ng-weak); border-color: var(--ng); color: var(--ng); }
  .choice.dim { opacity: .45; }

  .result { text-align: center; padding: 10px 0; }
  .result .big { font-size: 2.4rem; font-weight: 700; margin: 4px 0; }
  .result ul { text-align: left; padding-left: 1.2em; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }

  .list-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  .list-tools label { display: flex; align-items: center; gap: 6px; font-size: .9rem; cursor: pointer; }
  .lesson-block { margin-bottom: 18px; }
  .lesson-block h2 { font-size: 1rem; margin: 0 0 6px; }
  .lesson-block h2 span { color: var(--muted); font-weight: 400; font-size: .85rem; margin-left: 6px; }
  .row { display: grid; grid-template-columns: 2.2em 1fr; gap: 4px 8px; padding: 9px 0; border-top: 1px solid var(--border); }
  .row .num { font-weight: 700; color: var(--muted); }
  .row .ans { font-weight: 700; color: var(--red); cursor: pointer; }
  .row .ans .rd { color: var(--muted); font-weight: 400; font-size: .82rem; margin-left: 6px; }
  .row .sent { grid-column: 2; font-size: .88rem; color: var(--muted); }
  .row .badge { font-size: .7rem; margin-left: 6px; padding: 0 6px; border-radius: 5px; background: var(--ng-weak); color: var(--ng); font-weight: 600; vertical-align: 2px; }
  .redsheet .row .ans:not(.open) { color: transparent; background: var(--red); border-radius: 4px; opacity: .85; }
  .redsheet .row .ans:not(.open) .rd { color: transparent; }

  footer { margin-top: 28px; color: var(--muted); font-size: .8rem; }
  footer button { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: .8rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>公民 語句補充 単語帳</h1>
    <p>第3章 公3-1-1〜公3-2-8 のスライドの ①② の語句</p>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" data-mode="card" aria-selected="true">カード</button>
    <button role="tab" data-mode="choice" aria-selected="false">二択</button>
    <button role="tab" data-mode="input" aria-selected="false">入力</button>
    <button role="tab" data-mode="list" aria-selected="false">一覧</button>
  </div>

  <details class="settings" id="settings">
    <summary><span>出題範囲・設定</span><span class="count" id="poolCount"></span></summary>
    <div class="settings-body">
      <div class="group-label">単元 <span><button data-all="1">すべて</button><button data-all="0">解除</button></span></div>
      <div class="chips" id="lessonChips"></div>
      <div class="group-label">出題する語句</div>
      <div class="chips" id="kindChips">
        <span class="chip" data-kind="num" aria-pressed="true">①②…の語句</span>
        <span class="chip" data-kind="key" aria-pressed="false">番号なしの赤字語句</span>
        <span class="chip" data-kind="fig" aria-pressed="false">三権分立の図（補足）</span>
      </div>
      <div class="group-label">オプション</div>
      <div class="chips">
        <span class="chip" id="optShuffle" aria-pressed="true">シャッフル</span>
        <span class="chip" id="optWeak" aria-pressed="false">苦手だけ</span>
      </div>
    </div>
  </details>

  <main id="main"></main>

  <footer>
    学習記録はこの端末のブラウザに保存されます。
    <button id="resetStats">記録をリセット</button>
  </footer>
</div>

<!-- data.js を更新したら v= の数字も上げる（古い data.js がキャッシュから読まれるのを防ぐ） -->
<script src="data.js?v=3"></script>
<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  CARDS.forEach((c, i) => { c.id = `${c.l}|${c.n}|${c.a}`; c.i = i; c.k = c.k || "num"; });
  const lessonOf = Object.fromEntries(LESSONS.map(l => [l.id, l]));

  // ---- 保存（使えない環境でも動くように）
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  let stats = store.get("koumin-stats", {});
  const saved = store.get("koumin-settings", {});
  const state = {
    mode: saved.mode || "card",
    lessons: new Set(saved.lessons || LESSONS.map(l => l.id)),
    kinds: new Set(saved.kinds || ["num"]),
    shuffle: saved.shuffle ?? true,
    weak: saved.weak ?? false,
    redsheet: saved.redsheet ?? false,
  };
  const saveSettings = () => store.set("koumin-settings", {
    mode: state.mode, lessons: [...state.lessons], kinds: [...state.kinds],
    shuffle: state.shuffle, weak: state.weak, redsheet: state.redsheet,
  });
  const isWeak = c => { const s = stats[c.id]; return !!s && (s.last === 0 || s.ng > s.ok); };
  const record = (c, ok) => {
    const s = stats[c.id] || { ok: 0, ng: 0 };
    ok ? s.ok++ : s.ng++; s.last = ok ? 1 : 0;
    stats[c.id] = s; store.set("koumin-stats", stats);
  };

  const pool = () => CARDS.filter(c => state.lessons.has(c.l) && state.kinds.has(c.k) && (!state.weak || isWeak(c)));
  const shuffled = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const makeDeck = (cards = pool()) => state.shuffle ? shuffled(cards) : cards.slice();

  // ---- 判定用の正規化：全角半角・カタカナ/ひらがな・空白・記号の違いは無視
  const norm = s => s.normalize("NFKC").toLowerCase()
    .replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60))
    .replace(/[\s・･「」『』()（）、。,.]/g, "");
  const accepted = c => {
    const out = new Set();
    const add = s => {
      out.add(norm(s));
      const m = s.match(/^(.*?)[（(](.*?)[）)]$/);
      if (m) { out.add(norm(m[1])); out.add(norm(m[2])); }
    };
    [c.a, c.r, ...(c.acc || [])].forEach(add);
    return out;
  };

  const sentence = (c, shown) => {
    const blank = `<span class="blank${shown ? " shown" : ""}">${shown ? esc(c.a) : esc(c.k === "num" ? c.n : "　")}</span>`;
    return esc(c.q).replace("{}", blank);
  };
  const metaHtml = (c, i, total) => {
    const l = lessonOf[c.l];
    const kindTag = c.k === "key" ? `<span class="tag key">赤字語句</span>` : c.k === "fig" ? `<span class="tag key">図（補足）</span>` : "";
    return `<div class="meta"><span><span class="tag">公${esc(c.l)}</span> ${esc(l.title)} ${kindTag}</span><span>${i + 1} / ${total}</span></div>
      <div class="progress"><div style="width:${(i / total) * 100}%"></div></div>`;
  };

  // ---- 設定UI
  const lessonChips = $("#lessonChips");
  lessonChips.innerHTML = LESSONS.map(l =>
    `<span class="chip" data-lesson="${l.id}" title="${esc(l.title)}">${l.id}<small>${esc(l.title)}</small></span>`
  ).join("");
  const syncSettingsUI = () => {
    lessonChips.querySelectorAll(".chip").forEach(ch => ch.setAttribute("aria-pressed", state.lessons.has(ch.dataset.lesson)));
    $("#kindChips").querySelectorAll(".chip").forEach(ch => ch.setAttribute("aria-pressed", state.kinds.has(ch.dataset.kind)));
    $("#optShuffle").setAttribute("aria-pressed", state.shuffle);
    $("#optWeak").setAttribute("aria-pressed", state.weak);
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.mode === state.mode));
    $("#poolCount").textContent = `${pool().length} 語`;
  };
  const changed = () => { saveSettings(); syncSettingsUI(); start(); };
  lessonChips.addEventListener("click", e => {
    const ch = e.target.closest(".chip"); if (!ch) return;
    const id = ch.dataset.lesson;
    state.lessons.has(id) ? state.lessons.delete(id) : state.lessons.add(id);
    changed();
  });
  document.querySelectorAll("[data-all]").forEach(b => b.addEventListener("click", e => {
    e.preventDefault();
    state.lessons = new Set(b.dataset.all === "1" ? LESSONS.map(l => l.id) : []);
    changed();
  }));
  $("#kindChips").addEventListener("click", e => {
    const ch = e.target.closest(".chip"); if (!ch) return;
    const k = ch.dataset.kind;
    state.kinds.has(k) ? state.kinds.delete(k) : state.kinds.add(k);
    changed();
  });
  $("#optShuffle").addEventListener("click", () => { state.shuffle = !state.shuffle; changed(); });
  $("#optWeak").addEventListener("click", () => { state.weak = !state.weak; changed(); });
  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => { state.mode = b.dataset.mode; changed(); }));
  $("#resetStats").addEventListener("click", () => {
    if (confirm("覚えた／苦手の記録をすべて消しますか？")) { stats = {}; store.set("koumin-stats", stats); changed(); }
  });

  const main = $("#main");
  let session = null;
  let keyHandler = null;
  document.addEventListener("keydown", e => {
    if (keyHandler && !e.isComposing && !e.altKey && !e.ctrlKey && !e.metaKey) keyHandler(e);
  });

  const emptyHtml = () => `<div class="panel empty">出題する語句がありません。<br>「出題範囲・設定」で単元を選んでください。${state.weak ? "<br>（「苦手だけ」がオンになっています）" : ""}</div>`;

  // ---- カードモード
  function startCard(cards) {
    const deck = makeDeck(cards);
    session = { deck, i: 0, shown: false, results: [] };
    renderCard();
  }
  function renderCard() {
    const s = session;
    if (!s.deck.length) { main.innerHTML = emptyHtml(); keyHandler = null; return; }
    if (s.i >= s.deck.length) return renderResult(s, startCard);
    const c = s.deck[s.i];
    main.innerHTML = `<div class="panel">
      ${metaHtml(c, s.i, s.deck.length)}
      <div class="flip-area" id="flip">
        <div class="question">${sentence(c, s.shown)}</div>
        <div class="reading">${s.shown ? esc(c.r) : ""}</div>
        ${c.note && s.shown ? `<div class="note">※${esc(c.note)}</div>` : ""}
      </div>
      ${s.shown
        ? `<div class="actions"><button class="btn ng" id="ng">まだ<kbd>1</kbd></button><button class="btn ok" id="ok">覚えた<kbd>2</kbd></button></div>`
        : `<div class="actions"><button class="btn primary" id="show">答えを見る<kbd>Space</kbd></button></div>
           <div class="flip-hint">問題文をタップしても答えが出ます</div>`}
    </div>`;
    const show = () => { s.shown = true; renderCard(); };
    const answer = ok => { record(c, ok); s.results.push({ c, ok }); s.i++; s.shown = false; renderCard(); };
    $("#flip").onclick = () => { if (!s.shown) show(); };
    if (s.shown) { $("#ng").onclick = () => answer(false); $("#ok").onclick = () => answer(true); }
    else $("#show").onclick = show;
    keyHandler = e => {
      if (!s.shown && (e.key === " " || e.key === "Enter")) { e.preventDefault(); show(); }
      else if (s.shown && (e.key === "1" || e.key === "ArrowLeft")) answer(false);
      else if (s.shown && (e.key === "2" || e.key === "ArrowRight" || e.key === " " || e.key === "Enter")) { e.preventDefault(); answer(true); }
    };
  }

  // ---- 二択モード
  const dummyOf = c => {
    const d = typeof DUMMY !== "undefined" && DUMMY[`${c.l}|${c.a}`];
    if (d) return d;
    // 用意していない語句は同じ単元の別の答えから選ぶ
    let others = CARDS.filter(o => o.l === c.l && o.a !== c.a);
    if (!others.length) others = CARDS.filter(o => o.a !== c.a);
    return others[Math.floor(Math.random() * others.length)].a;
  };
  function startChoice(cards) {
    const deck = makeDeck(cards).map(c => {
      const opts = [c.a, dummyOf(c)];
      if (Math.random() < .5) opts.reverse();
      return { c, opts };
    });
    session = { deck, i: 0, picked: null, results: [] };
    renderChoice();
  }
  function renderChoice() {
    const s = session;
    if (!s.deck.length) { main.innerHTML = emptyHtml(); keyHandler = null; return; }
    if (s.i >= s.deck.length) return renderResult(s, startChoice);
    const { c, opts } = s.deck[s.i];
    const p = s.picked;
    const done = p !== null;
    const cls = o => !done ? "" : o === c.a ? "right" : o === p ? "wrong" : "dim";
    main.innerHTML = `<div class="panel">
      ${metaHtml(c, s.i, s.deck.length)}
      <div class="question">${sentence(c, done)}</div>
      <div class="reading">${done ? esc(c.r) : ""}</div>
      <div class="choices">
        ${opts.map((o, k) => `<button class="choice ${cls(o)}" data-k="${k}" ${done ? "disabled" : ""}>${esc(o)}<kbd>${k + 1}</kbd></button>`).join("")}
      </div>
      ${done ? `
        <div class="verdict ${p === c.a ? "ok" : "ng"}">${p === c.a ? "○ 正解！" : "× 不正解"}
          <span class="correct">${esc(c.a)}（${esc(c.r)}）</span></div>
        ${c.note ? `<div class="note">※${esc(c.note)}</div>` : ""}
        <div class="actions"><button class="btn primary" id="next">次へ<kbd>Enter</kbd></button></div>` : ""}
    </div>`;
    const pick = o => { s.picked = o; record(c, o === c.a); s.results.push({ c, ok: o === c.a }); renderChoice(); };
    const next = () => { s.i++; s.picked = null; renderChoice(); };
    if (!done) {
      main.querySelectorAll(".choice").forEach(b => b.onclick = () => pick(opts[b.dataset.k]));
      keyHandler = e => {
        if (e.key === "1" || e.key === "ArrowLeft") pick(opts[0]);
        else if (e.key === "2" || e.key === "ArrowRight") pick(opts[1]);
      };
    } else {
      $("#next").onclick = next;
      keyHandler = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); next(); } };
    }
  }

  // ---- 入力テストモード
  function startInput(cards) {
    const deck = makeDeck(cards);
    session = { deck, i: 0, judged: null, typed: "", results: [] };
    renderInput();
  }
  function renderInput() {
    const s = session;
    if (!s.deck.length) { main.innerHTML = emptyHtml(); keyHandler = null; return; }
    if (s.i >= s.deck.length) return renderResult(s, startInput);
    const c = s.deck[s.i];
    const j = s.judged;
    main.innerHTML = `<div class="panel">
      ${metaHtml(c, s.i, s.deck.length)}
      <div class="question">${sentence(c, j !== null)}</div>
      <form class="answer-input" id="form" autocomplete="off">
        <input id="ans" placeholder="${c.k === "num" ? esc(c.n) + " に入る語句" : "空欄に入る語句"}（ひらがなでもOK）" value="${esc(s.typed)}" ${j !== null ? "readonly" : ""} enterkeyhint="done">
        ${j === null ? `<button class="btn primary small" type="submit">判定</button>` : ""}
      </form>
      ${j === null ? `<div class="actions"><button class="btn small" id="skip" style="margin-left:auto">わからない</button></div>` : `
        <div class="verdict ${j ? "ok" : "ng"}">${j ? "○ 正解！" : "× 不正解"}
          <span class="correct">${esc(c.a)}（${esc(c.r)}）</span></div>
        ${c.note ? `<div class="note">※${esc(c.note)}</div>` : ""}
        <div class="actions">
          ${j ? "" : `<button class="btn small" id="override">今のは正解にする</button>`}
          <button class="btn primary" id="next">次へ<kbd>Enter</kbd></button>
        </div>`}
    </div>`;
    const input = $("#ans");
    const judge = typed => {
      s.typed = typed;
      s.judged = typed.trim() !== "" && accepted(c).has(norm(typed));
      record(c, s.judged); s.results.push({ c, ok: s.judged });
      renderInput();
    };
    const next = () => { s.i++; s.judged = null; s.typed = ""; renderInput(); };
    if (j === null) {
      $("#form").onsubmit = e => { e.preventDefault(); judge(input.value); };
      $("#skip").onclick = () => judge("");
      input.focus();
      keyHandler = null;
    } else {
      $("#next").onclick = next;
      const ov = $("#override");
      if (ov) ov.onclick = () => {
        const st = stats[c.id]; st.ng--; st.ok++; st.last = 1; store.set("koumin-stats", stats);
        s.results[s.results.length - 1].ok = true; s.judged = true; renderInput();
      };
      $("#next").focus();
      keyHandler = e => { if (e.key === "Enter") { e.preventDefault(); next(); } };
    }
  }

  // ---- 結果
  function renderResult(s, restart) {
    keyHandler = null;
    const ok = s.results.filter(r => r.ok).length;
    const wrong = s.results.filter(r => !r.ok).map(r => r.c);
    main.innerHTML = `<div class="panel result">
      <div>おつかれさま！</div>
      <div class="big">${ok} / ${s.results.length}</div>
      ${wrong.length ? `<p>まだの語句</p><ul>${wrong.map(c => `<li><b>${esc(c.a)}</b>（公${esc(c.l)} ${esc(c.n)}）</li>`).join("")}</ul>` : `<p>全部できました 🎉</p>`}
      <div class="actions">
        ${wrong.length ? `<button class="btn ng" id="again">まだの語句だけもう一度</button>` : ""}
        <button class="btn primary" id="restart">最初からもう一度</button>
      </div>
    </div>`;
    if (wrong.length) $("#again").onclick = () => restart(wrong);
    $("#restart").onclick = () => restart();
  }

  // ---- 一覧（赤シート）
  function renderList() {
    keyHandler = null;
    const cards = pool();
    if (!cards.length) { main.innerHTML = emptyHtml(); return; }
    const blocks = LESSONS.filter(l => cards.some(c => c.l === l.id)).map(l => `
      <section class="lesson-block">
        <h2>公${esc(l.id)} ${esc(l.title)}<span>${esc(l.sub)}</span></h2>
        ${cards.filter(c => c.l === l.id).map(c => `
          <div class="row">
            <div class="num">${esc(c.n)}</div>
            <div><span class="ans" data-i="${c.i}">${esc(c.a)}<span class="rd">${esc(c.r)}</span></span>${isWeak(c) ? `<span class="badge">苦手</span>` : ""}</div>
            <div class="sent">${esc(c.q).replace("{}", "（　　）")}</div>
          </div>`).join("")}
      </section>`).join("");
    main.innerHTML = `<div class="panel ${state.redsheet ? "redsheet" : ""}" id="listPanel">
      <div class="list-tools">
        <label><input type="checkbox" id="rs" ${state.redsheet ? "checked" : ""}> 赤シート（答えを隠す・タップで表示）</label>
      </div>
      ${blocks}
    </div>`;
    $("#rs").onchange = e => { state.redsheet = e.target.checked; saveSettings(); renderList(); };
    $("#listPanel").addEventListener("click", e => { const a = e.target.closest(".ans"); if (a) a.classList.toggle("open"); });
  }

  function start() {
    if (state.mode === "card") startCard();
    else if (state.mode === "choice") startChoice();
    else if (state.mode === "input") startInput();
    else renderList();
  }
  syncSettingsUI();
  start();
})();
</script>
</body>
</html>
